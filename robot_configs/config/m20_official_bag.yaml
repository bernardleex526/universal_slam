# Offline reference only: official M20 dataset; not proof of M20 Pro geometry.
robot_name: m20_official_bag
adapter: m20
calibration_verified: false
source: https://github.com/DeepRoboticsLab/lightning-lm-deep-robotics

tf:
  map_frame: uslam/map
  odom_frame: uslam/odom
  base_frame: uslam/base_link
  lidar_frame: uslam/lidar
  imu_frame: uslam/imu

topics:
  points_topic: /uslam/points_raw
  imu_topic: /uslam/imu_raw
  odom_topic: /uslam/odom
  cmd_vel_topic: /uslam/cmd_vel
  obstacles_topic: /uslam/obstacles

sensors:
  source_cloud_topic: /LIDAR/POINTS
  source_cloud_reliable: true
  source_imu_topic: /IMU
  source_imu_reliable: true
  source_cloud_frame: lidar_link
  source_imu_frame: imu
  allow_empty_imu_frame: true
  cloud_format: robosense_absolute
  max_scan_duration_s: 0.25

# Identity matches the official reference algorithm configuration, not a calibration.
extrinsics:
  imu: {x: 0.0, y: 0.0, z: 0.0, roll: 0.0, pitch: 0.0, yaw: 0.0}
  lidar: {x: 0.0, y: 0.0, z: 0.0, roll: 0.0, pitch: 0.0, yaw: 0.0}

lidar:
  lidar_type: 2
  scan_line: 192
  timestamp_unit: 0
  scan_rate: 10
  blind: 0.5

velocity: {vx_max: 0.2, vy_max: 0.2, wz_max: 0.3}
navigation: {robot_radius: 0.55, ground_z: -1.2}
network: {robot_ip: 10.21.31.103, port: 30000, cmd_frequency_hz: 20, heartbeat_hz: 1}
control:
  calibration_confirmed: false
  expected_gait: 0  # Must match the gait used for full-scale calibration.
  vx_full_scale: 0.0
  vy_full_scale: 0.0
  wz_full_scale: 0.0
  cmd_timeout_s: 0.25
  status_timeout_s: 1.5
  odom_timeout_s: 0.3
