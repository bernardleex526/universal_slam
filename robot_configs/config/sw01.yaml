# ============================================================
# 机型配置: SW01（璇玑动力 Hypertron-SW01，中型四足）
#
# 每机型接入 = 此 yaml + 对应 adapter 包（robot_adapters/adapter_sw01）
#
# 说明:
#   - 无 ROS 支持，走专有 C 库 Daedalus（libASTRALL_SDK.so）。
#   - 外参单位: 米，相对质心；朝向待标定。
#   - 系列手册另示前后双雷达 (0.444, 0, -0.032) / (-0.420, 0, 0.019)，实机确认单/双雷达后修正。
# ============================================================
robot_name: sw01

tf:
  odom_frame: odom
  body_frame: body
  base_frame: base_link     # 机器人本体帧（定义于质心）
  lidar_frame: lidar
  imu_frame: imu

topics:
  points_topic: /points_raw
  imu_topic: /imu_raw
  cmd_vel_topic: /cmd_vel

extrinsics:
  # 单位：xyz 为米，roll/pitch/yaw 为【度】。用途：
  #   1) bringup 静态 TF base_link→imu / base_link→lidar（RPY→四元数）
  #   2) FAST-LIO mapping.extrinsic_T/R（由 bringup 换算为 lidar→IMU 注入）
  # ⚠️ 以下均为官方手册初值，实机标定（P4）前不要当作真实外参使用。
  lidar:
    # 官方外参初值（SW01 专属手册），朝向待标定
    x: 0.3732
    y: 0.0
    z: 0.080
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
    # TODO: 系列手册另示双雷达配置 (0.444, 0, -0.032) / (-0.420, 0, 0.019)，实机确认
  imu:
    # 官方外参初值（SW01 专属手册），朝向待标定
    x: -0.00115
    y: 0.0
    z: 0.0595
    roll: 0.0
    pitch: 0.0
    yaw: 0.0

velocity:
  # 保守默认值，实机标定后修正
  vx_max: 0.5
  vy_max: 0.5
  wz_max: 0.6

lidar:
  lidar_type: 2        # 2: 机械雷达，标准 PointCloud2（自定义协议重组后输出）
  scan_line: 64        # 待实测
  timestamp_unit: 2    # 无逐点 time 字段时不参与计算（见下方字段契约）；保留仅作对照
  blind: 2.0
  # 字段契约（P0，勿伪造数据）：SW01 协议不提供 ring 与逐点 time，
  # /points_raw 仅 x,y,z,intensity。锁定版 FAST-LIO (2fffc57) lidar_type=2
  # 在缺 time 字段时走 yaw 角时序回退（given_offset_time=false）、缺 ring 时
  # 全部点归入 layer 0 —— 与现有字段真实兼容，无需生成伪 ring/time。

sdk:
  library: libASTRALL_SDK.so          # Daedalus 专有 SDK
  # 说明：适配器不需要 robot_ip —— 控制经 SDK（SDK 内部维护连接），
  # 点云为入站 UDP（监听 0.0.0.0:pointcloud_udp_port）。
  imu_frequency_hz: 250
  control_frequency_hz: 30            # AstrallMove 下发频率：SDK 契约 ≥20Hz，
                                      # 默认 30Hz 为 50ms 看门狗留调度余量（P1）
  heartbeat_frequency_hz: 10          # 心跳 10Hz（500ms 无心跳进失控保护）
  heartbeat_timeout_ms: 20            # AstrallHeartbeat 超时
  move_timeout_ms: 20                 # AstrallMove 超时
  watchdog_timeout_ms: 50             # 50ms 无移动指令自动停止
  cmd_stale_timeout_ms: 50            # 适配器侧: 50ms 未收到新 /cmd_vel → 发 (0,0,0)
  auth_retry_period_s: 5              # 控制权丢失后重试周期
  control_auth_required: true         # 需 AstrallAuthControl 申请控制权（遥控器可抢占）
  motion_mode: MOVE                   # 控制前须切换运动模式 (ASTRALL_SPORT_MODE_CMD_MOVE)
  pointcloud_udp_port: 6100           # 自定义协议 AstrallPosCloudData
  pointcloud_packet_max_points: 50    # 单包 ≤50 点，需按 total/index 重组
  pointcloud_point_bytes: 28          # 单点 = int32 xyz + uint32 rgba（手册 5.10，
                                      # sizeof(CloudPointRaw) static_assert 锁定）
  pointcloud_coord_unit: int32        # 坐标 int32，单位待实测（疑似 mm）
  point_scale: 0.001                  # int32 → 米（mm→m；实测确认后调整）
  cloud_packet_layout: dynamic        # 协议布局: dynamic=头20B+posNum×20B+尾2B（默认）；
                                      #          fixed=完整固定结构体 1022B。
                                      # 解析按长度精确校验（截断/残留一律拒绝），
                                      # 实测抓包后确认（见 adapter_sw01/README.md）
