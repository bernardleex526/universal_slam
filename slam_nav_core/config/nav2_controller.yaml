# ============================================================
# Nav2 局部规划器 (controller_server)
# 局部: MPPI Controller, motion_model = "Omni"（全向，适配轮足/足式）
# ============================================================
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # odom 输入话题（FAST-LIO /Odometry remap 到 /odom）
    odom_topic: /odom

    # Progress checker 参数
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Goal checker 参数
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # MPPI 参数
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000
      vx_max: 0.5
      vx_min: -0.35
      vy_max: 0.5
      # 速度上限按机型覆盖（robot_configs/<robot>.yaml 的 velocity 段），此处为通用占位
      wz_max: 1.9
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      temperature: 0.3
      gamma: 0.015
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      reset_period: 1.0             # Humble backport 特有参数
      visualize: true
      motion_model: "Omni"          # 全向运动模型

      # 评价函数（critics）
      critics: ["ObstaclesCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "PreferForwardCritic"]

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        consider_footprint: false
        collision_cost: 10000.0
        collision_margin_distance: 0.1
        near_goal_distance: 0.5
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 5.0

    # 内嵌局部代价地图（Humble 标准：costmap 内嵌于 controller_server，
    # 原独立 nav2_local_costmap.yaml 已废弃，见该文件顶部注释）
    local_costmap:
      local_costmap:
        ros__parameters:
          update_frequency: 5.0
          publish_frequency: 2.0
          global_frame: odom
          robot_base_frame: base_link
          robot_radius: 0.4
          rolling_window: true
          width: 6.0
          height: 6.0
          resolution: 0.05
          track_unknown_space: false
          plugins: ["obstacle_layer", "inflation_layer"]
          obstacle_layer:
            plugin: "nav2_costmap_2d::ObstacleLayer"
            observation_sources: pointcloud
            pointcloud:
              topic: /points_raw
              data_type: "PointCloud2"
              min_obstacle_height: 0.0
              max_obstacle_height: 2.0
              marking: true
              clearing: true
              obstacle_min_range: 0.1
              raytrace_max_range: 8.0
          inflation_layer:
            plugin: "nav2_costmap_2d::InflationLayer"
            inflation_radius: 0.55
            cost_scaling_factor: 3.0
