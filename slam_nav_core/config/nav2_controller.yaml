# ============================================================
# Nav2 局部规划器 (controller_server)
# 局部: MPPI Controller, motion_model = "Omni"（全向，适配轮足/足式）
# ============================================================
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # odom 输入话题（FAST-LIO /Odometry remap 到 /odom）
    odom_topic: /odom

    # Progress checker 参数
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Goal checker 参数
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # MPPI 参数
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000
      vx_max: 0.5
      vx_min: -0.35
      vy_max: 0.5
      # 速度上限按机型覆盖（机器人 profile 的 velocity 段），此处为通用占位
      wz_max: 0.6
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      temperature: 0.3
      gamma: 0.015
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      reset_period: 1.0             # Humble backport 特有参数
      visualize: true
      motion_model: "Omni"          # 全向运动模型

      # 评价函数（critics）
      critics: ["ObstaclesCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "PreferForwardCritic"]

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        consider_footprint: false
        collision_cost: 10000.0
        # Severe-penalty band around obstacles. The planner plans with robot_radius + this + slack, so
        # its paths keep the band clear: with 0.1 m and no slack MPPI froze at gaps whose centre line sat
        # on the band; 0.1 m + 0.1 m slack closed ordinary 1.6 m passages for the 0.55 m robot circle.
        collision_margin_distance: 0.05
        near_goal_distance: 0.5
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 5.0

# Costmap is a separate ROS node within this process.
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      robot_radius: 0.55
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      track_unknown_space: false
      plugins: ["obstacle_layer", "terrain_layer", "inflation_layer"]
      # Vertical obstacles of the current scan (walls, people, box faces): ordinary mark + raytrace
      # clear, plus obstacle_filter's clearing rays over observed obstacle-free ground, which erase
      # marks with nothing behind them to raytrace to (a person who walked away in an open area).
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: pointcloud clear_rays
        pointcloud:
          topic: /obstacles
          data_type: "PointCloud2"
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          obstacle_min_range: 0.1
          # Humble default obstacle_max_range is 2.5 m: nothing farther was ever marked.
          obstacle_max_range: 8.0
          raytrace_max_range: 9.0
        clear_rays:
          topic: /clear_rays
          data_type: "PointCloud2"
          marking: false
          clearing: true
          obstacle_max_range: 9.0
          raytrace_max_range: 9.0
      # Terrain marks from obstacle_filter (virtual points): step edges (curbs, platform/stair edges,
      # ramp sides) and drops (pits, stairs down, platform edges from above). Own layer, marking only:
      # the obstacle layer's 2D raytracing to a wall behind a curb or across a pit would erase them,
      # and a drop leaves the lidar's view when the robot reaches it. Cleared only by the filter's
      # clearing rays (clear_rays), which run from the sensor over continuously observed ground and stop before any
      # drop, step or unseen gap: a mark is erased only by seeing ground where it was. No footprint
      # clearing: standing at an edge must not erase it, or a robot nudged into the inscribed radius
      # removes the marks keeping it out.
      terrain_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        footprint_clearing_enabled: false
        observation_sources: terrain clear_rays
        terrain:
          topic: /terrain_obstacles
          data_type: "PointCloud2"
          marking: true
          clearing: false
          obstacle_min_range: 0.0
          obstacle_max_range: 9.0
          raytrace_max_range: 9.0
        clear_rays:
          topic: /clear_rays
          data_type: "PointCloud2"
          marking: false
          clearing: true
          obstacle_max_range: 9.0
          raytrace_max_range: 9.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Must exceed robot_radius, or MPPI/Smac get no cost gradient outside the
        # inscribed radius and skim obstacles. The launch enforces radius + 0.3 m.
        inflation_radius: 1.0
        cost_scaling_factor: 4.0
