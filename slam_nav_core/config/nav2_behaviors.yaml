# ============================================================
# Nav2 恢复行为 (behavior_server, 来自 nav2_behaviors 包)
# 标准恢复：spin / back_up / wait。
# 文件名与包名一致：nav2_behaviors.yaml（Humble 中 nav2_recoveries
# 已并入 nav2_behaviors，旧包名不再存在）。
# ============================================================
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # Names are the action servers the default Humble BTs call: spin, backup, wait.
    behavior_plugins: ["spin", "backup", "wait"]
    # Humble's nav2_behaviors plugins are registered by name ("pkg/Class"), not C++ type.
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
